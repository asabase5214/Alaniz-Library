<!doctype html>
<html lang="en">
  <head>
    <!--get fonts from Google Fonts-->
    <meta charset="utf-8" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=National+Park:wght@200..800&display=swap" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@300..700&family=MuseoModerno:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <link rel="icon" href="Untitled design (20).png">
    <title>
      Alaniz Library
    </title>

    <style>
        :root {
          --bg:#071226; --card:#0b1220; --muted:#9aa4b2; --accent:#60a5fa; --accent-2:#7c3aed;
          --glass: rgba(255,255,255,0.02);
          --checked-bg: rgba(124,58,237,0.08);
          --text: #e6eef6;
          --border: rgba(255,255,255,0.03);
          --panel-bg: rgba(255,255,255,0.02);
          --modal-bg: #071226;
          --input-bg: transparent;
          font-family: Inter, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial;
          color-scheme: dark;
        }

        :root.light {
          --bg:#f0f4f8; --card:#ffffff; --muted:#4a5568; --accent:#2563eb; --accent-2:#7c3aed;
          --glass: rgba(0,0,0,0.03);
          --checked-bg: rgba(124,58,237,0.06);
          --text: #1a202c;
          --border: rgba(0,0,0,0.08);
          --panel-bg: rgba(255,255,255,0.8);
          --modal-bg: #ffffff;
          --input-bg: transparent;
          color-scheme: light;
        }

        html, body {
          height:100%;
          margin:0;
          color: var(--text);
          font-family: Comfortaa, MuseoModerno, National Park, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial;
          transition: background 0.3s, color 0.3s;
        }

        html {
          background: linear-gradient(180deg,#041022 0%, #071226 100%);
          min-height: 100%;
        }

        body {
          background: transparent;
        }

        /* Light mode */
        :root.light html {
          background: linear-gradient(180deg, #e8eef5 0%, #f0f4f8 100%) !important;
        }

        :root.light .app {
          background: transparent;
          box-shadow: none;
        }

        :root.light .panel {
          background: #ffffff;
          box-shadow: 0 2px 8px rgba(0,0,0,0.06);
        }

        :root.light .modal-backdrop {
          background: rgba(100,120,150,0.4);
        }

        :root.light .checked {
          background: rgba(124,58,237,0.06);
          border-left: 4px solid var(--accent-2);
        }

        :root.light .tag {
          background: rgba(0,0,0,0.06);
          color: var(--muted);
        }

        :root.light .pill {
          background: rgba(0,0,0,0.05);
        }

        :root.light .searchbar {
          background: rgba(0,0,0,0.04);
        }

        :root.light input[type="search"],
        :root.light input[type="text"],
        :root.light input[type="number"],
        :root.light input[type="date"],
        :root.light select,
        :root.light textarea {
          color: #1a202c;
        }

        :root.light .btn.ghost {
          color: var(--muted);
          border-color: rgba(0,0,0,0.1);
        }

        :root.light .btn.secondary {
          color: var(--accent);
          border-color: rgba(37,99,235,0.3);
        }

        :root.light hr {
          border-top-color: rgba(0,0,0,0.08) !important;
        }

        :root.light {
          --border: rgba(0,0,0,0.08);
        }

        :root.light .app {
          background: transparent;
          box-shadow: none;
        }

        :root.light .panel {
          background: #ffffff;
          box-shadow: 0 2px 8px rgba(0,0,0,0.06);
        }

        :root.light [data-id] {
          background: transparent !important;
        }

        :root.light .checked {
          background: rgba(124,58,237,0.06) !important;
        }

        .app {
          max-width:1100px;
          margin:28px auto;
          padding:20px;
          background: transparent;
          border-radius:12px;
          box-shadow:0 6px 30px rgba(2,6,23,0.6);
        }

        header {
          display:flex;
          gap:16px;
          align-items:center;
          justify-content:space-between;
          margin-bottom:18px;
        
        }
        h1 {
          font-size:20px;
          margin:0;
          letter-spacing:0.2px;
        }

        .controls{
          display:flex;
          gap:8px;
          align-items:center;
          flex-wrap:wrap;
        }

        button, .btn {
          background:var(--accent);
          color:#04203a;
          border:0;
          padding:8px 12px;
          border-radius:8px;
          cursor:pointer;
          font-weight:600;
          font-family: Comfortaa, MuseoModerno, National Park, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial;
        }

        .btn.secondary {
          background:transparent;
          color:var(--accent);
          border:1px solid rgba(96,165,250,0.12);
        }

        .btn.ghost {
          background:transparent;
          color:var(--muted);
          border:1px dashed rgba(255,255,255,0.03);
        }

        .searchbar {
          display:flex;
          gap:8px;
          align-items:center;
          background:var(--glass);
          padding:8px;
          border-radius:10px;
        }

        input[type="search"], input[type="text"], input[type="number"], input[type="date"], select {
          background:transparent;
          border:0;
          color:var(--muted);
          padding:6px 8px;
          outline:none;
          min-width:160px;
          max-width:100%;
          box-sizing:border-box;
          font-family: Comfortaa, MuseoModerno, National Park, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial;
        }

        .filters {
          display:flex;
          gap:8px;
          align-items:center;
        }

        .grid {
          display:grid;
          grid-template-columns: 1fr 320px;
          gap:18px;
        }

        .panel {
          background: var(--panel-bg);
          padding:14px;
          border-radius:10px;
          min-height:120px;
        }

        table {
          width:100%;
          border-collapse:collapse;
          font-size:14px;
        }

        th,td {
          padding:8px 10px;
          text-align:left;
          border-bottom:1px solid var(--border);
          color: var(--text);
        }

        th {
          font-weight:700;
          color:var(--muted);
          font-size:12px;
        }

        .row-actions{ 
          display:flex;
          gap:6px;
        }

        .tag {
          display:inline-block;
          padding:4px 8px;
          border-radius:999px;
          background:rgba(255,255,255,0.03);
          color:var(--muted);
          font-size:12px;
        }

        .small {
          font-size:13px;
          color:var(--muted);
        }

        .empty {
          padding:40px;
          text-align:center;
          color:var(--muted);
        }

        .modal-backdrop {
          position:fixed;
          inset:0;
          background:rgba(2,6,23,0.6);
          display:flex;
          align-items:center;
          justify-content:center;
          z-index:60;
        }

        .modal {
          width:760px;
          max-width:95%;
          background: var(--modal-bg);
          padding:18px;
          border-radius:12px;
          box-shadow:0 10px 40px rgba(2,6,23,0.7);
        }

        .modal {
          max-height: 90vh;
          overflow: auto;
          display: flex;
          flex-direction: column;
        }

        .form-row {
          display:flex;
          gap:8px;
          margin-bottom:8px;
        }

        label {
          font-size:13px;
          color:var(--muted);
          margin-bottom:6px;
          display:block;
        }

        textarea {
          min-height:80px;
          resize:vertical;
          width:100%;
          padding:8px;
          border-radius:8px;
          border:1px solid var(--border);
          background: var(--input-bg);
          color: var(--text);
        }

        .meta {
          font-size:12px;
          color:var(--muted);
          margin-top:8px;
        }

        .import-preview {
          max-height:40vh;
          overflow:auto;
          border:1px solid rgba(255,255,255,0.03);
          padding:8px;
          border-radius:8px;
          background:rgba(255,255,255,0.01);
        }

        .footer {
          display:flex;
          justify-content:space-between;
          align-items:center;
          margin-top:12px;
        }

        .pill {
          padding:6px 10px;
          border-radius:999px;
          background:rgba(255,255,255,0.02);
          color:var(--muted);
          font-size:13px;
        }

        .modal .import-actions {
          position: sticky;
          bottom: 0;
          background: linear-gradient(180deg, rgba(7,18,38,0.0), rgba(7,18,38,0.95));
          padding-top: 10px;
          padding-bottom: 8px;
          display: flex;
          justify-content: flex-end;
          gap: 8px;
        }

        .checked {
          background: var(--checked-bg);
          border-left: 4px solid var(--accent-2);
        }

        .user-badge {
          font-weight:700;
          color:var(--accent-2);
        }

        #sortSelect {
          background:transparent;
          border:0;
          color:var(--muted);
          padding:6px 8px;
          outline:none;
          cursor:pointer;
          border-radius: 5px;
        }

        #sortSelect option {
          background: var(--modal-bg);
          color: var(--text);
        }

        /* grid view */
        .books-grid {
          display: grid;
          grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
          gap: 16px;
          padding: 4px;
        }

        .books-grid .book-card {
          display: flex;
          flex-direction: column;
          cursor: pointer;
          border-radius: 8px;
          overflow: hidden;
          transition: transform 0.15s, box-shadow 0.15s;
          background: rgba(255,255,255,0.02);
          position: relative;
        }

        .books-grid .book-card:hover {
          transform: translateY(-3px);
          box-shadow: 0 8px 24px rgba(0,0,0,0.4);
        }

        .books-grid .book-card img {
          width: 100%;
          aspect-ratio: 2/3;
          object-fit: cover;
          display: block;
        }

        .books-grid .book-card .card-info {
          padding: 8px;
          flex: 1;
        }

        .books-grid .book-card .card-title {
          font-weight: 700;
          font-size: 12px;
          line-height: 1.3;
          display: -webkit-box;
          -webkit-line-clamp: 2;
          -webkit-box-orient: vertical;
          overflow: hidden;
        }

        .books-grid .book-card .card-author {
          font-size: 11px;
          color: var(--muted);
          margin-top: 3px;
          display: -webkit-box;
          -webkit-line-clamp: 1;
          -webkit-box-orient: vertical;
          overflow: hidden;
        }

        .books-grid .book-card .card-checked {
          position: absolute;
          top: 6px;
          right: 6px;
          background: var(--accent-2);
          color: white;
          font-size: 10px;
          padding: 2px 6px;
          border-radius: 999px;
          font-weight: 700;
        }

        :root.light .books-grid .book-card {
          background: #ffffff;
          box-shadow: 0 2px 8px rgba(0,0,0,0.06);
        }

        .pill-filter {
          display: flex;
          flex-wrap: wrap;
          gap: 6px;
          align-items: center;
        }

        .pill-filter .filter-pill {
          padding: 4px 10px;
          border-radius: 999px;
          font-size: 12px;
          cursor: pointer;
          border: 1px solid rgba(96,165,250,0.2);
          background: transparent;
          color: var(--muted);
          font-family: Comfortaa, MuseoModerno, National Park, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial;
          font-weight: 600;
          transition: background 0.15s, color 0.15s;
          user-select: none;
        }

        .pill-filter .filter-pill.active {
          background: var(--accent);
          color: #04203a;
          border-color: var(--accent);
        }

        :root.light .pill-filter .filter-pill {
          border-color: rgba(37,99,235,0.2);
        }

        :root.light .pill-filter .filter-pill.active {
          background: var(--accent);
          color: #ffffff;
          border-color: var(--accent);
        }

        @media (max-width: 500px) {
          .pill-filter {
            flex-wrap: wrap;
          }

          .filter-pill {
            flex: 0 0 auto !important;
            width: auto !important;
          }
        }

        @media (max-width: 500px) {
          .books-grid {
            grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
            gap: 10px;
          }
        }

        /* mobile friendly */

        @media (max-width:900px){
          .grid {
            grid-template-columns:1fr;
          }

          .controls {
            flex-direction:column;
            align-items:stretch;
          }
          
          .modal {
            width:95%
          }
          
          .form-row {
            flex-direction:column;
          }
        }

        @media (max-width: 768px) {
          header {
            flex-direction: column;
            align-items: flex-start;
          }

          .controls {
            flex-direction: column;
            align-items: stretch;
            width: 100%;
          }

          .searchbar {
            flex-direction: column;
            align-items: stretch;
          }

          .filters {
            flex-direction: column;
            align-items: stretch;
          }

          .filters input, .filters button {
            width: 100%;
            box-sizing: border-box;
          }

          #sortSelect {
            width: 100%;
          }

          .grid {
            grid-template-columns: 1fr;
          }

          .modal {
            width: 95%;
            padding: 14px;
          }

          .form-row {
            flex-direction: column;
          }

          .footer {
            flex-direction: column;
            gap: 8px;
            align-items: stretch;
          }

          .footer > div:last-child {
            display: flex;
            flex-direction: column;
            gap: 8px;
          }

          .footer button {
            width: 100%;
          }
        }

        @media (max-width: 480px) {
          .app {
            margin: 8px;
            padding: 12px;
          }

          h1 {
            font-size: 18px;
          }

          .panel {
            padding: 10px;
          }
        }

        @media (max-width: 500px) {
          .controls {
            width: 100%;
          }

          .searchbar {
            flex-direction: column;
            align-items: stretch;
            width: 100%;
            box-sizing: border-box;
          }

          #sortSelect {
            width: 100%;
          }

          .filters {
            flex-direction: column;
            align-items: stretch;
          }

          .filters select,
          .filters input {
            width: 100%;
            box-sizing: border-box;
          }

          .filters button:not(.filter-pill) {
            width: 100%;
            box-sizing: border-box;
          }

          header {
            gap: 8px;
          }

          input[type="search"], input[type="text"], input[type="number"], input[type="date"], select {
            min-width: 0;
            width: 100%;
          }

          .book-cover {
            flex: 0 0 clamp(60px, 18vw, 120px) !important;
          }

          [data-id] {
            flex-wrap: wrap;
          }

          [data-id] > div:last-child {
            width: 100%;
            text-align: left !important;
          }
        }
    </style>

  </head>

    <body>
      <div class="app" role="application" aria-label="Library manager">
        <header>
          <div>
            <h1>Alaniz Library</h1>
            <div class="small" style="display:none">Fields: ISBN, Title, Quantity, Description, Authors, Publisher, Published, Pages, Language, Location</div>
          </div>

          <div class="controls">
            <div class="searchbar" title="Search">
              <input id="searchInput" type="search" placeholder="Search title, authors, ISBN, language, location" aria-label="Search books" title="Search title, authors, ISBN, language, location">
              <select id="sortSelect" title="Sort">
                <option value="title">Sort: Title</option>
                <option value="authors">Sort: Authors</option>
                <option value="published">Sort: Published</option>
                <option value="added">Sort: Date added</option>
              </select>
            </div>

            <div class="filters">
              <div id="langFilter" class="pill-filter" title="Filter by language"></div>
              <div id="locFilter" class="pill-filter" title="Filter by location"></div>
              <button class="btn ghost" id="viewToggleBtn" title="Toggle grid/list view">⊞</button>
              <button class="btn ghost" id="themeBtn" title="Toggle light/dark mode">🌙</button>
              <button class="btn ghost" id="myBooksBtn" title="My checked out books" style="display:none">My Books</button>
              <button class="btn ghost" id="exportBtn">Export</button>
              <button class="btn secondary" id="signinBtn">Sign in</button>
            </div>
          </div>
        </header>

      <div class="grid">
        <section class="panel" aria-labelledby="libraryList">
          <h3 id="libraryList" style="margin-top:0">Books</h3>
          <div id="booksContainer"></div>
        </section>

        <aside class="panel">
          <h4 style="margin-top:0">Stats</h4>
          <div id="statsArea" class="meta"></div>
          <hr style="border:none; border-top:1px solid rgba(255,255,255,0.03); margin:12px 0;">
          </div>
        </aside>
      </div>

      <div><button class="btn ghost" id="ScrollToTopBtn" title="Scroll to top" style="position: fixed; bottom: 20px; right: 20px;" onclick="scrollToTopSmooth()">↑</button></div>

      <div id="modalRoot" aria-hidden="true"></div>

      <script>
        const STORAGE_KEY = 'myLibraryBooks_v3';
        const USER_KEY = 'myLibraryUser';

        function uid(prefix='b'){
          return prefix + Date.now().toString(36) + Math.random().toString(36).slice(2,8);
        }

        function loadBooks(){
          try{
            const raw = localStorage.getItem(STORAGE_KEY);
            if(!raw) return [];
            return JSON.parse(raw);
          }catch(e){
            console.error('Failed to parse storage', e);
            return [];
          }
        }
        function saveBooks(list){
          localStorage.setItem(STORAGE_KEY, JSON.stringify(list));
        }

        function loadUser(){
          try{
            const raw = localStorage.getItem(USER_KEY);
            if(!raw) return null;
            return JSON.parse(raw);
          }catch(e){
            return null;
          }
        }
        function saveUser(u){
          localStorage.setItem(USER_KEY, JSON.stringify(u));
        }

        let books = loadBooks();
        let currentUser = loadUser();
        let currentView = localStorage.getItem('libraryView') || 'list';

        const LOCATIONS = ['Upstairs', 'Living Room', 'Kitchen', 'Parents Room', 'Jaelles Room'];
        const LANGUAGES = ['English', 'Spanish'];

        function getUniqueLocations() {
          return [...new Set(books.map(b => (b.location||'').trim()).filter(Boolean))].sort();
        }

        function getUniqueLanguages() {
          return [...new Set(books.map(b => (b.language||'').trim()).filter(Boolean))].sort();
        }

        let selectedLocations = new Set();
        let selectedLanguages = new Set();

        function buildPillFilters() {
          function buildPills(container, options, selectedSet, label) {
            container.innerHTML = '';
            const labelEl = document.createElement('span');
            labelEl.className = 'small';
            labelEl.style.cssText = 'margin-right:4px; white-space:nowrap; align-self:center;';
            labelEl.textContent = label + ':';
            container.appendChild(labelEl);
            options.forEach(opt => {
              const pill = document.createElement('button');
              pill.className = 'filter-pill' + (selectedSet.has(opt) ? ' active' : '');
              pill.textContent = opt;
              pill.addEventListener('click', () => {
                if (selectedSet.has(opt)) {
                  selectedSet.delete(opt);
                } else {
                  selectedSet.add(opt);
                }
                pill.classList.toggle('active', selectedSet.has(opt));
                render();
              });
              container.appendChild(pill);
            });
          }
          buildPills(langFilterEl, getUniqueLanguages(), selectedLanguages, 'Language');
          buildPills(locFilterEl, getUniqueLocations(), selectedLocations, 'Location');
        }

        // Light mode/dark mode
        let currentTheme = localStorage.getItem('libraryTheme') || 'dark';
        function applyTheme(theme){
          currentTheme = theme;
          localStorage.setItem('libraryTheme', theme);
          const root = document.documentElement;
          const btn = document.getElementById('themeBtn');
          if(theme === 'light'){
            root.classList.add('light');
            root.style.background = 'linear-gradient(180deg, #e8eef5 0%, #f0f4f8 100%)';
            document.body.style.background = 'transparent';
            if(btn) btn.textContent = '☀️';
          } else {
            root.classList.remove('light');
            root.style.background = 'linear-gradient(180deg, #041022 0%, #071226 100%)';
            document.body.style.background = 'transparent';
            if(btn) btn.textContent = '🌙';
          }
        }

        (function(){
          const saved = localStorage.getItem('libraryTheme') || 'dark';
          const root = document.documentElement;
          if(saved === 'light'){
            root.classList.add('light');
            root.style.background = 'linear-gradient(180deg, #e8eef5 0%, #f0f4f8 100%)';
          } else {
            root.style.background = 'linear-gradient(180deg, #041022 0%, #071226 100%)';
          }
          document.body.style.background = 'transparent';
        })();

        applyTheme(currentTheme);
        document.getElementById('themeBtn').addEventListener('click', ()=>{
          applyTheme(currentTheme === 'dark' ? 'light' : 'dark');
        });

        function applyView(view) {
          currentView = view;
          localStorage.setItem('libraryView', view);
          const btn = document.getElementById('viewToggleBtn');
          if (btn) btn.textContent = view === 'grid' ? '☰' : '⊞';
        }

        applyView(currentView);
        document.getElementById('viewToggleBtn').addEventListener('click', () => {
          applyView(currentView === 'list' ? 'grid' : 'list');
          render();
        });

        const modalRoot = document.getElementById('modalRoot');
        function openModal(htmlContent){
          modalRoot.innerHTML = '';
          const backdrop = document.createElement('div');
          backdrop.className = 'modal-backdrop';
          backdrop.innerHTML = `<div class="modal">${htmlContent}</div>`;
          backdrop.addEventListener('click', (e)=>{
            if(e.target === backdrop) closeModal();
          });
          modalRoot.appendChild(backdrop);
          modalRoot.setAttribute('aria-hidden','false');
          return backdrop.querySelector('.modal');
        }
        function closeModal(){
          modalRoot.innerHTML = '';
          modalRoot.setAttribute('aria-hidden','true');
        }

        const booksContainer = document.getElementById('booksContainer');
        const searchInput = document.getElementById('searchInput');
        const langFilterEl = document.getElementById('langFilter');
        const locFilterEl = document.getElementById('locFilter');
        const sortSelect = document.getElementById('sortSelect');
        const signinBtn = document.getElementById('signinBtn');
        const ScrollToTopBtn = document.getElementById('ScrollToTopBtn');

        window.addEventListener('scroll', function () {
          if (window.scrollY === 0) {
              ScrollToTopBtn.style.visibility = "hidden";
          }else{
            ScrollToTopBtn.style.visibility = "visible";
          };
        });

        function render(){
          const myBooksBtn = document.getElementById('myBooksBtn');
          if(currentUser && currentUser.name){
            signinBtn.textContent = `Signed in: ${currentUser.name}`;
            signinBtn.classList.remove('btn','secondary');
            signinBtn.classList.add('btn','ghost');
            myBooksBtn.style.display = '';
            const myCount = books.filter(b => b.checkedOut && b.checkedOut.byName === currentUser.name).length;
            myBooksBtn.textContent = myCount > 0 ? `My Books (${myCount})` : 'My Books';
          } else {
            signinBtn.textContent = 'Sign in';
            signinBtn.classList.remove('btn','ghost');
            signinBtn.classList.add('btn','secondary');
            myBooksBtn.style.display = 'none';
          }

          const q = searchInput.value.trim().toLowerCase();
          const sortBy = sortSelect.value;

          let list = [...books];

          if(selectedLanguages.size > 0) {
            list = list.filter(b => selectedLanguages.has((b.language||'').trim()));
          }
          if(selectedLocations.size > 0) {
            list = list.filter(b => selectedLocations.has((b.location||'').trim()));
          }

          if(q){
            list = list.filter(b => {
              return ['title','authors','isbn','description','publisher','language','location'].some(k=>{
                return (b[k]||'').toString().toLowerCase().includes(q);
              });
            });
          }

          list.sort((a,b)=>{
            if(sortBy==='title') return (a.title||'').localeCompare(b.title||'');
            if (sortBy === 'authors') {
              const lastNameA = (a.authors || '').split(' ').pop();
              const lastNameB = (b.authors || '').split(' ').pop();
              return lastNameA.localeCompare(lastNameB);
            }
            if(sortBy==='published') return (new Date(b.published||0)) - (new Date(a.published||0));
            return (b.added||0) - (a.added||0);
          });

          if(list.length === 0){
            booksContainer.innerHTML = `<div class="empty"><strong>No books found</strong><div class="small">Add books or import your Orca Scan export.</div></div>`;
            renderStats(list);
            return;
          }

          let html = '';

          if (currentView === 'grid') {
            const cards = list.map(b => {
              const checked = b.checkedOut ? true : false;
              return `
                <div class="book-card" data-id="${b.id}">
                  <img src="${getCoverUrl(b.isbn, 'M')}" onerror="tryOlidFallback(this, '${escapeHtml(b.isbn||'')}', 'M')" style="width:100%; aspect-ratio:2/3; object-fit:cover; display:block;">

                  <div class="card-info">
                    <div class="card-title">${escapeHtml(b.title||'Untitled')}</div>
                    <div class="card-author">${escapeHtml(b.authors||'—')}</div>
                  </div>
                </div>
              `;
            }).join('');
            html = `<div class="books-grid">${cards}</div>`;
          } else {
            const rows = list.map(b => {
              const authors = escapeHtml(b.authors || '');
              const tags = (b.language ? `<span class="tag">${escapeHtml(b.language)}</span>` : '') + (b.pages ? ` <span class="pill">${escapeHtml(b.pages)}p</span>` : '');
              const qty = `<div class="small">Qty: ${escapeHtml(String(b.quantity||1))}</div>`;
              const pub = b.published ? `<div class="small">Published: ${escapeHtml(formatDate(b.published))}</div>` : '';
              const checked = b.checkedOut ? true : false;
              const checkedBy = checked ? escapeHtml(b.checkedOut.byName || 'Someone') : '';
              const checkedBadge = checked ? `<span class="pill">Checked out</span>` : '';
              const containerClass = checked ? 'checked' : '';
              return `
                <div class="${containerClass}" style="display:flex; gap:16px; align-items:flex-start; padding:10px 0; cursor:pointer;" data-id="${b.id}">
                  <div class="book-cover" style="flex:0 0 120px;">
                    <img src="${getCoverUrl(b.isbn, 'M')}" onerror="tryOlidFallback(this, '${escapeHtml(b.isbn||'')}', 'M')" style="width:100%; border-radius:6px;">
                  </div>
                  <div style="flex:1;">
                    <div style="display:flex; gap:12px; align-items:flex-start;">
                      <div style="min-width:6px; height:36px; border-radius:6px; background:linear-gradient(180deg,var(--accent),var(--accent-2));"></div>
                      <div>
                        <div style="font-weight:700">${escapeHtml(b.title||'Untitled')} ${checkedBadge}</div>
                        <div class="small">${authors || '—'}</div>
                        <div style="margin-top:6px">${tags} ${pub} ${qty}</div>
                        <div class="small" style="margin-top:6px">${escapeHtml((b.description||'').slice(0,180))}${(b.description||'').length>180 ? '…' : ''}</div>
                        ${checked ? `<div class="small" style="margin-top:6px">Checked out by <span class="user-badge">${checkedBy}</span></div>` : ''}
                      </div>
                    </div>
                  </div>
                  <div style="text-align:right; white-space:nowrap;">
                    ${!isOlid(b.isbn) ? `<div class="small" style="margin-bottom:6px">ISBN: ${escapeHtml(b.isbn||'—')}</div>` : ''}
                  </div>
                </div>
              `;
            }).join('<hr style="border:none;border-top:1px solid var(--border)">');
            html = rows;
          }

          booksContainer.innerHTML = html;

          booksContainer.querySelectorAll('[data-id]').forEach(el=>{
            el.addEventListener('click', (e)=>{
              const target = e.target;
              if(target.closest('button')) return;
              const id = el.dataset.id;
              openDetailModal(id);
            });
          });

          renderStats(list);
        }

        function renderStats(list = books){
          const area = document.getElementById('statsArea');
          const total = list.reduce((s,b)=> s + (Number(b.quantity)||0), 0);
          const count = list.length;
          const langs = [...new Set(list.map(b => (b.language||'').trim()).filter(Boolean))].slice(0,20);
          const checkedCount = list.filter(b => b.checkedOut).length;
          const booksWithPages = list.filter(b => Number(b.pages) > 0);
          const booksWithDate = list.filter(b => b.published && !isNaN(new Date(b.published)));
          const longest = booksWithPages.sort((a,b) => Number(b.pages) - Number(a.pages))[0];
          const shortest = booksWithPages.sort((a,b) => Number(a.pages) - Number(b.pages))[0];

          const oldest = booksWithDate.sort((a,b) => new Date(a.published) - new Date(b.published))[0];
          const newest = booksWithDate.sort((a,b) => new Date(b.published) - new Date(a.published))[0];

          area.innerHTML = `
            <div><strong>${count}</strong> titles · <strong>${total}</strong> copies</div>
            <div class="small">Checked out: ${checkedCount} · Languages: ${langs.length || 0}</div>
            <hr style="border:none; border-top:1px solid rgba(255,255,255,0.03); margin:12px 0;">
            <div class="small" style="margin-bottom:6px"><strong>Fun facts</strong></div>
            ${longest ? `<div class="small">Longest book: <strong>${escapeHtml(longest.title)}</strong> (${longest.pages}p)</div><br>` : ''}
            ${shortest && shortest.id !== longest?.id ? `<div class="small">Shortest book: <strong>${escapeHtml(shortest.title)}</strong> (${shortest.pages}p)</div><br>` : ''}
            ${oldest ? `<div class="small">Oldest book: <strong>${escapeHtml(oldest.title)}</strong> (${oldest.published?.slice(0,4)})</div><br>` : ''}
            ${newest && newest.id !== oldest?.id ? `<div class="small">Newest book: <strong>${escapeHtml(newest.title)}</strong> (${newest.published?.slice(0,4)})</div>` : ''}
          `;
        }

        function addBook(data){

            id: uid(),

            description: data.description||'',
            authors: data.authors||'',
            publisher: data.publisher||'',
            published: data.published||'',
            pages: data.pages||'',
            language: data.language||'',
            location: data.location||'',
            checkedOut: data.checkedOut || null,
            added: Date.now()
          };
          books.unshift(b);
          saveBooks(books);
          render();
          return b;

          modal.querySelector('#exportCsv').addEventListener('click', ()=>{
            const csv = toCSV(books);
            const blob = new Blob([csv], {type:'text/csv'});
            downloadBlob(blob, `library-${new Date().toISOString().slice(0,10)}.csv`);
          });
        }

        function loadXLSX(){
          if(window.XLSX) return Promise.resolve(window.XLSX);
          return new Promise((resolve, reject) => {
            const s = document.createElement('script');
            s.src = './libs/xlsx.full.min.js';
            s.onerror = () => {
              s.remove();
              const s2 = document.createElement('script');
              s2.src = 'https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js';
              s2.onload = () => resolve(window.XLSX);
              s2.onerror = (e) => reject(new Error('Failed to load XLSX library'));
              document.head.appendChild(s2);
            };
            s.onload = () => resolve(window.XLSX);
            document.head.appendChild(s);
          });
        }

        function openImportModal(){
          const html = `
            <h3>Import file</h3>
            <div style="margin-top:8px; display:flex; flex-direction:column; gap:12px;">
              <div class="small">Supported: CSV, JSON, XML, HTML (table), XLSX</div>
              <div>
                <input id="importFile" type="file" accept=".csv,.json,.xml,.html,.htm,.xlsx" />
              </div>
              <div id="importPreviewArea" style="margin-top:0;"></div>

              <!-- sticky action row -->
              <div class="import-actions">
                <button class="btn secondary" id="cancelImport">Cancel</button>
                <button class="btn" id="confirmImport" disabled>Import</button>
              </div>
            </div>
          `;
          const modal = openModal(html);
          const fileInput = modal.querySelector('#importFile');
          const previewArea = modal.querySelector('#importPreviewArea');
          const confirmBtn = modal.querySelector('#confirmImport');
          modal.querySelector('#cancelImport').addEventListener('click', closeModal);

          let parsedRows = [];
          let headers = [];

          fileInput.addEventListener('change', async (e)=>{
            const f = e.target.files[0];
            if(!f) return;
            const name = f.name.toLowerCase();
            previewArea.innerHTML = `<div class="small">Parsing ${escapeHtml(f.name)}…</div>`;
            confirmBtn.disabled = true;
            try{
              if(name.endsWith('.json')){
                const text = await f.text();
                const data = JSON.parse(text);
                const arr = Array.isArray(data) ? data : (Array.isArray(data.items) ? data.items : Object.values(data));
                parsedRows = arr.map(obj => normalizeObject(obj));
                headers = Object.keys(parsedRows[0]||{});
              } else if(name.endsWith('.csv')){
                const text = await f.text();
                const {rows, hdrs} = parseCSV(text);
                parsedRows = rows;
                headers = hdrs;
              } else if(name.endsWith('.xml')){
                const text = await f.text();
                const {rows, hdrs} = parseXML(text);
                parsedRows = rows;
                headers = hdrs;
              } else if(name.endsWith('.html') || name.endsWith('.htm')){
                const text = await f.text();
                const {rows, hdrs} = parseHTMLTable(text);
                parsedRows = rows;
                headers = hdrs;
              } else if(name.endsWith('.xlsx')){
                try{
                  await loadXLSX();
                }catch(err){
                  previewArea.innerHTML = `<div class="small">Could not load XLSX support: ${escapeHtml(err.message)}</div>`;
                  console.error(err);
                  return;
                }
                const arrayBuffer = await f.arrayBuffer();
                const wb = XLSX.read(arrayBuffer, {type:'array'});
                const first = wb.SheetNames[0];
                const sheet = wb.Sheets[first];
                const json = XLSX.utils.sheet_to_json(sheet, {defval:''});
                parsedRows = json.map(obj => normalizeObject(obj));
                headers = Object.keys(parsedRows[0]||{});
              } else {
                previewArea.innerHTML = `<div class="small">Unsupported file type.</div>`;
                return;
              }

              if(parsedRows.length === 0){
                previewArea.innerHTML = `<div class="small">No rows found in file.</div>`;
                return;
              }

              const sampleRows = parsedRows.slice(0,6);
              const possibleFields = ['ignore','isbn','title','quantity','description','authors','publisher','published','pages','language','location'];
              const autoMap = autoMapHeaders(headers);

              let mappingHtml = `<div class="small">Preview (${parsedRows.length} rows). Map columns to fields:</div>`;
              mappingHtml += `<div class="import-preview" style="margin-top:8px;">`;
              mappingHtml += `<table><thead><tr>${headers.map(h=>`<th>${escapeHtml(h)}</th>`).join('')}</tr></thead><tbody>`;
              sampleRows.forEach(r=>{
                mappingHtml += `<tr>${headers.map(h=>`<td>${escapeHtml(String(r[h]||''))}</td>`).join('')}</tr>`;
              });
              mappingHtml += `</tbody></table></div>`;

              mappingHtml += `<div style="margin-top:8px;">`;
              headers.forEach(h=>{
                mappingHtml += `<div style="display:flex; gap:8px; align-items:center; margin-bottom:6px;">
                  <div style="min-width:160px;"><strong>${escapeHtml(h)}</strong></div>
                  <div style="flex:1;">
                    <select data-col="${escapeHtml(h)}" class="col-map">
                      ${possibleFields.map(p=>`<option value="${p}" ${autoMap[h]===p ? 'selected' : ''}>${p}</option>`).join('')}
                    </select>
                  </div>
                </div>`;
              });
              mappingHtml += `</div>`;

              mappingHtml += `<div class="small" style="margin-top:8px">Duplicates are detected by ISBN if present.</div>`;

              previewArea.innerHTML = mappingHtml;
              confirmBtn.disabled = false;

              confirmBtn.scrollIntoView({behavior:'smooth', block:'nearest'});
              confirmBtn.focus();

              confirmBtn.onclick = ()=>{
                const selects = previewArea.querySelectorAll('.col-map');
                const map = {};
                selects.forEach(s => map[s.dataset.col] = s.value);
                const toImport = parsedRows.map(row=>{
                  const obj = {};
                  for(const col of headers){
                    const target = map[col];
                    if(!target || target==='ignore') continue;
                    obj[target] = (row[col]||'').toString();
                  }
                  return obj;
                });
                let added = 0, skipped = 0;
                toImport.forEach(item=>{
                  const isbn = (item.isbn||'').trim();
                  if(isbn){
                    const exists = books.some(b => b.isbn && b.isbn.trim() === isbn);
                    if(exists){ skipped++; return; }
                  }
                  addBook(item);
                  added++;
                });
                alert(`Imported ${added} rows. Skipped ${skipped} duplicates.`);
                closeModal();
              };

            }catch(err){
              console.error(err);
              previewArea.innerHTML = `<div class="small">Error parsing file: ${escapeHtml(err.message||String(err))}</div>`;
              confirmBtn.disabled = true;
            }
          });
        }

        // parsing functions
        function normalizeObject(obj){
          const out = {};
          for(const k of Object.keys(obj||{})){
            out[k] = obj[k];
          }
          return out;
        }

        function parseCSV(text){
          const lines = text.split(/\r?\n/).filter(Boolean);
          if(lines.length===0) return {rows:[], hdrs:[]};
          const hdr = parseCSVLine(lines[0]);
          const rows = [];
          for(let i=1;i<lines.length;i++){
            const row = parseCSVLine(lines[i]);
            if (row.length === 0) continue;
            const obj = {};
            for(let j=0;j<hdr.length;j++){
              obj[hdr[j]] = row[j] !== undefined ? row[j] : '';
            }
            rows.push(obj);
          }
          return {rows, hdrs:hdr};
        }
        function parseCSVLine(line){
          const out = [];
          let cur = '', inQuotes=false;
          for(let i=0;i<line.length;i++){
            const ch = line[i];
            if(ch === '"' ){
              if(inQuotes && line[i+1] === '"'){ cur += '"'; i++; continue; }
              inQuotes = !inQuotes;
              continue;
            }
            if(ch === ',' && !inQuotes){ out.push(cur); cur=''; continue; }
            cur += ch;
          }
          out.push(cur);
          return out;
        }

        function parseXML(text){
          const parser = new DOMParser();
          const doc = parser.parseFromString(text, 'application/xml');
          const parseError = doc.querySelector('parsererror');
          if(parseError) throw new Error('Invalid XML');
          const root = doc.documentElement;
          let items = [];
          const candidates = ['record','item','row','book','entry'];
          for(const c of candidates){
            const nodes = root.querySelectorAll(c);
            if(nodes.length>0){ items = Array.from(nodes); break; }
          }
          if(items.length===0) items = Array.from(root.children);
          const rows = items.map(node=>{
            const obj = {};
            Array.from(node.children).forEach(ch=>{
              obj[ch.nodeName] = ch.textContent || '';
            });
            return obj;
          });
          const hdrs = [...new Set(rows.flatMap(r=>Object.keys(r)))];
          return {rows, hdrs};
        }

        function parseHTMLTable(text){
          const parser = new DOMParser();
          const doc = parser.parseFromString(text, 'text/html');
          const table = doc.querySelector('table');
          if(!table) return {rows:[], hdrs:[]};
          const hdrs = Array.from(table.querySelectorAll('thead th')).map(th=>th.textContent.trim());
          if(hdrs.length===0){
            const firstRow = table.querySelector('tr');
            if(firstRow){
              hdrs.push(...Array.from(firstRow.querySelectorAll('td,th')).map(td=>td.textContent.trim()));
            }
          }
          const rows = [];
          const trs = table.querySelectorAll('tbody tr');
          const useTrs = trs.length ? trs : table.querySelectorAll('tr');
          useTrs.forEach((tr, idx)=>{
            if(idx===0 && hdrs.length && tr.querySelectorAll('th').length) return;
            const cells = Array.from(tr.querySelectorAll('td,th')).map(td=>td.textContent.trim());
            if(cells.length===0) return;
            const obj = {};
            for(let i=0;i<hdrs.length;i++){
              obj[hdrs[i]||`col${i+1}`] = cells[i] || '';
            }
            rows.push(obj);
          });
          return {rows, hdrs};
        }

        function autoMapHeaders(headers){
          const map = {};
          headers.forEach(h=>{
            const trimmed = h.trim();
            const key = trimmed.toLowerCase();
            if(/^id$/.test(key)) map[trimmed]='id';
            else if(/^(checkedoutbyname|checked_out_by_name)$/.test(key)) map[trimmed]='checkedOutByName';
            else if(/^(checkedoutbyemail|checked_out_by_email)$/.test(key)) map[trimmed]='checkedOutByEmail';
            else if(/^(checkedoutdate|checked_out_date)$/.test(key)) map[trimmed]='checkedOutDate';
            else if(/^isbn$/.test(key)) map[trimmed]='isbn';
            else if(/^title$/.test(key)) map[trimmed]='title';
            else if(/^(quantity|qty|count)$/.test(key)) map[trimmed]='quantity';
            else if(/^(desc|description|notes)$/.test(key)) map[trimmed]='description';
            else if(/^(author|authors)$/.test(key)) map[trimmed]='authors';
            else if(/^publisher$/.test(key)) map[trimmed]='publisher';
            else if(/^(published|publishdate|publish_date)$/.test(key)) map[trimmed]='published';
            else if(/^(page|pages)$/.test(key)) map[trimmed]='pages';
            else if(/^(lang|language)$/.test(key)) map[trimmed]='language';
            else if(/^(location|shelf|place)$/.test(key)) map[trimmed]='location';
            else map[trimmed]='ignore';
          });
          console.log('Header mapping:', map);
          return map;
        }

        function normalizeBookData(rows, hdrs){
          const headerMap = autoMapHeaders(hdrs);
          return rows.map(row => {
            const normalized = {};
            for (const [originalHeader, value] of Object.entries(row)) {
              const mappedField = headerMap[originalHeader];
              if (mappedField && mappedField !== 'ignore') {
                normalized[mappedField] = value;
              }
            }
            // make sure all books have a unique id
            if (!normalized.id) {
              normalized.id = uid();
            }
            return convertCheckoutFields(normalized);
          });
        }

        function convertCheckoutFields(book) {
          if (book.checkedOutByName || book.checkedOutByEmail || book.checkedOutDate) {
            const result = { ...book };
            result.checkedOut = {
              byName: book.checkedOutByName || '',
              byEmail: book.checkedOutByEmail || '',
              date: book.checkedOutDate || ''
            };
            delete result.checkedOutByName;
            delete result.checkedOutByEmail;
            delete result.checkedOutDate;
            return result;
          }
          return book;
        }

        function getCoverUrl(isbn, size) {
          if (!isbn) return getPlaceholder();
          const val = isbn.toString().trim();
          const type = val.toUpperCase().startsWith('OL') ? 'olid' : 'isbn';
          return `https://covers.openlibrary.org/b/${type}/${encodeURIComponent(val)}-${size}.jpg`;
        }

        function tryOlidFallback(img, isbn, size) {
          const val = (isbn || '').toString().trim();
          if (!val || img.dataset.triedOlid) {
            showPlaceholder(img);
            return;
          }
          if (!val.toUpperCase().startsWith('OL')) {
            img.dataset.triedOlid = '1';
            img.onerror = () => showPlaceholder(img);
            img.src = `https://covers.openlibrary.org/b/olid/${encodeURIComponent(val)}-${size}.jpg`;
          } else {
            showPlaceholder(img);
          }
        }

        function showPlaceholder(img) {
          img.onerror = null;
          img.style.background = 'rgba(255,255,255,0.05)';
          img.style.minHeight = '80px';
          img.src = 'data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 width=%22100%22 height=%22140%22><rect width=%22100%25%22 height=%22100%25%22 fill=%22%23162032%22/><text x=%2250%25%22 y=%2250%25%22 dominant-baseline=%22middle%22 text-anchor=%22middle%22 fill=%22%239aa4b2%22 font-size=%2211%22>No cover</text></svg>';
        }

        function getPlaceholder() {
          return 'data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 width=%22100%22 height=%22140%22><rect width=%22100%25%22 height=%22100%25%22 fill=%22%23162032%22/><text x=%2250%25%22 y=%2250%25%22 dominant-baseline=%22middle%22 text-anchor=%22middle%22 fill=%22%239aa4b2%22 font-size=%2211%22>No cover</text></svg>';
        }

        function isOlid(val) {
          return val && val.toString().trim().toUpperCase().startsWith('OL');
        }

        function formatDate(dateStr) {
          if (!dateStr) return '';
          const d = new Date(dateStr);
          if (isNaN(d)) return dateStr;
          return d.getFullYear().toString();
        }
        
        function escapeHtml(s){
          if(s===null || s===undefined) return '';
          return String(s).replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;');
        }

        function downloadBlob(blob, filename){
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = url; a.download = filename;
          document.body.appendChild(a);
          a.click();
          a.remove();
          URL.revokeObjectURL(url);
        }

        function toCSV(arr){
          if(!arr || arr.length===0) return '';
          const keys = ['isbn','title','quantity','description','authors','publisher','published','pages','language','location','added'];
          const hdr = keys.join(',');
          const lines = arr.map(o => keys.map(k => csvEscape(o[k]||'')).join(','));
          return hdr + '\n' + lines.join('\n');
        }
        function csvEscape(v){
          const s = String(v).replaceAll('"','""');
          if(s.includes(',') || s.includes('"') || s.includes('\n')) return `"${s}"`;
          return s;
        }

        [searchInput, sortSelect].forEach(el=>{
          el.addEventListener('input', debounce(render, 180));
        });

        buildPillFilters();

        document.addEventListener('keydown', (e) => {
          if (e.key === '/' && document.activeElement !== searchInput) {
            e.preventDefault();
            searchInput.focus();
            searchInput.select();
          }

          if (e.key === 'Escape' && modalRoot.children.length > 0) {
            closeModal();
          }
        });

        function debounce(fn, wait=200){
          let t;
          return function(...args){
            clearTimeout(t);
            t = setTimeout(()=>fn.apply(this,args), wait);
          };
        }

        try{
          console.log('Library script loaded — DOM ready:', !!document.getElementById('exportBtn'));
          render();
        }catch(err){
          console.error('Initialization error', err);
          alert('An error occurred during startup. See console for details.');
        }

        // get  data from google Sheets
        async function fetchBooksFromGoogleSheet(sheetUrl) {
          if (!sheetUrl || sheetUrl.trim() === '') {
            console.log('No Google Sheets URL configured. Using local storage only.');
            return;
          }

          try {
            console.log('Syncing with Google Sheets...');

            const booksData = await new Promise((resolve, reject) => {
              const callbackName = 'gsCallback_' + Date.now();
              const script = document.createElement('script');

              window[callbackName] = function(data) {
                delete window[callbackName];
                script.remove();
                resolve(data);
              };

              script.onerror = () => reject(new Error('Script load failed'));
              script.src = sheetUrl + '?callback=' + callbackName + '&_=' + Date.now();
              document.head.appendChild(script);

              setTimeout(() => reject(new Error('Timeout')), 10000);
            });

            if (!booksData || booksData.length === 0) {
              console.warn('Google Sheets returned no data');
              return;
            }

            const headers = Object.keys(booksData[0]);
            books = normalizeBookData(booksData, headers);
            saveBooks(books);
            render();

            console.log(`✓ Successfully synced ${books.length} books from Google Sheets`);
          } catch (error) {
            console.warn('Could not sync with Google Sheets:', error.message);
            console.log('Using locally cached data.');
          }
        }

        // write checkout and return to google sheets
        async function writeCheckoutToSheet(bookId, action, byName, byEmail, date) {
          if (!GOOGLE_SHEET_URL || GOOGLE_SHEET_URL.trim() === '') return;

          try {
            const params = new URLSearchParams({
              action: action,
              id: bookId,
              byName: byName || '',
              byEmail: byEmail || '',
              date: date || ''
            });

            await new Promise((resolve, reject) => {
              const callbackName = 'gsWriteCallback_' + Date.now();
              const script = document.createElement('script');

              window[callbackName] = function(response) {
                delete window[callbackName];
                script.remove();
                resolve(response);
              };

              script.onerror = () => reject(new Error('Write failed'));
              script.src = GOOGLE_SHEET_URL + '?' + params.toString() + '&callback=' + callbackName;
              document.head.appendChild(script);

              setTimeout(() => reject(new Error('Write timeout')), 10000);
            });

            console.log(`✓ Sent ${action} update to Google Sheets for book ${bookId}`);
          } catch (error) {
            console.warn(`Could not write ${action} to Google Sheets:`, error.message);
          }
        }

        const GOOGLE_SHEET_URL = 'https://script.google.com/macros/s/AKfycbzYUk_o1WTc1whhn0Y6FqzONenaIjuSUon3pvWXDSC2BMboLnoXncjLg0JCEZTYNac0/exec';

        fetchBooksFromGoogleSheet(GOOGLE_SHEET_URL);
      </script>
